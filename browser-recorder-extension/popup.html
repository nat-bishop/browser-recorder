<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Browser Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 280px;
            padding: 16px;
            background: #f8fafc;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }

        .recording-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .recording-indicator.active {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #64748b;
        }

        .status-row:not(:last-child) {
            margin-bottom: 8px;
        }

        .status-value {
            font-weight: 500;
            color: #1e293b;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2563eb;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
        }

        .btn-secondary {
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #f1f5f9;
        }

        .hidden {
            display: none !important;
        }

        .session-id {
            font-family: monospace;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="recording-indicator" id="indicator"></div>
        <h1>Browser Recorder</h1>
    </div>

    <div class="status">
        <div class="status-row">
            <span>Status</span>
            <span class="status-value" id="status-text">Stopped</span>
        </div>
        <div class="status-row">
            <span>Events</span>
            <span class="status-value" id="event-count">0</span>
        </div>
    </div>

    <div class="buttons">
        <button id="start-btn" class="btn-primary">Start Recording</button>
        <button id="stop-btn" class="btn-danger hidden">Stop Recording</button>
        <button id="export-btn" class="btn-secondary" disabled>Export Session</button>
        <button id="clear-btn" class="btn-secondary" disabled>Clear</button>
    </div>

    <div class="session-id" id="session-id"></div>

    <script src="popup.js"></script>
</body>
</html>
