[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-agents"
version = "0.1.0"
description = "Record browser interactions and convert them to AI agent tools"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "playwright>=1.49.0",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    # LLM providers
    "pydantic-settings>=2.7.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",      # Ollama (OpenAI-compatible)
    "langchain-google-genai>=2.0.0", # Google Gemini
    "langchain-anthropic>=0.3.0",    # Anthropic Claude
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
browser-agents = "browser_agents.cli:app"

[project.optional-dependencies]
dev = [
    "basedpyright>=1.36.2",
    "git-cliff>=2.11.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agents"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    # Core
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade

    # Bug detection
    "B",      # flake8-bugbear (catches real bugs)
    "A",      # flake8-builtins (shadowed builtins)
    "RUF",    # Ruff-specific rules

    # Code quality
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "PERF",   # Perflint

    # Imports
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "TID",    # flake8-tidy-imports
    "TC",     # flake8-type-checking

    # Specific
    "T20",    # flake8-print
    "PTH",    # flake8-use-pathlib
    "TD",     # flake8-todos
]
ignore = [
    # Performance (sometimes clearer as-is)
    "PERF203",  # try-except in loop

    # Style preferences (often less readable "fixed")
    "SIM102",   # combine nested if
    "SIM103",   # return condition directly
    "SIM108",   # ternary operator
    "SIM117",   # combine with statements

    # TODOs (too strict)
    "TD002",    # missing author in TODO
    "TD003",    # missing issue link in TODO

    # Type checking imports (too much churn for little benefit)
    "TC001",    # move app import to TYPE_CHECKING
    "TC002",    # move third-party import to TYPE_CHECKING
    "TC003",    # move stdlib import to TYPE_CHECKING
    "TC004",    # move import out of TYPE_CHECKING

    # Returns (often clearer with assignment)
    "RET504",   # unnecessary assignment before return

    # Line length (fix incrementally - many are in strings/docstrings)
    "E501",     # line too long

    # Conflicts with formatter
    "ISC001",   # single-line-implicit-string-concatenation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "T20", "E402", "E501", "F841"]  # assert False, blind exception, print(), imports, long lines, unused vars
".claude/*" = ["T20", "E501", "F841"]  # print(), long lines, unused vars OK in CLI scripts
"src/browser_agents/cli.py" = ["B008", "B904"]  # typer patterns, Exit doesn't need exception chaining
"src/browser_agents/recorder.py" = ["B008", "SIM105"]  # typer patterns, try-except-pass for CSP is clearer
"src/browser_agents/demo.py" = ["SIM105"]  # try-except-pass for browser errors has comments
"src/browser_agents/playback.py" = ["SIM105"]  # try-except-pass for CSP
"src/browser_agents/playback/*" = ["T20"]  # print statements are intentional logging
"src/browser_agents/storage/*" = ["PERF401"]  # list comprehension less readable here
"src/browser_agents/models/__init__.py" = ["RUF022"]  # __all__ sorted by category intentionally

[tool.ruff.lint.isort]
known-first-party = ["browser_agents"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "browser: marks tests that require a browser",
]

[dependency-groups]
dev = [
    "git-cliff>=2.11.0",
    "pre-commit>=4.5.1",
]
