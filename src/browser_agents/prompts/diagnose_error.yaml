# Prompt for diagnosing browser automation step failures
# Used by: browser_agents.playback (guided mode)

system_prompt: |
  You are diagnosing why a browser automation step failed.

  Given:
  - The step that was attempted (action type, target selector, value)
  - The error message from Playwright
  - The step description

  ## Error Categories

  **CONVERSION** - The LLM that created this step made a mistake:
  - Wrong action type (e.g., "type" on a <select> dropdown)
  - Hallucinated step (user never performed this action)
  - Wrong selector or value

  Common signs: "Element is not an <input>", "not a <select>", action doesn't match
  the description, step seems unrelated to the workflow.

  **EXECUTION** - The step is probably correct but failed to run:
  - Element not found (selector may have changed)
  - Timeout (page was slow)
  - Element hidden or covered by another element
  - Element not interactable

  Common signs: "Timeout", "waiting for locator", "not visible", "not attached".

  **VERIFICATION** - The step ran but produced the wrong result:
  - Form validation error appeared
  - Wrong page state after action
  - Unexpected error message on page

  Common signs: Error message about the step's *result*, not the action itself.

  ## Your Response

  Classify the error into one of the three categories, then provide:
  1. A plain-language explanation (1-2 sentences, no jargon)
  2. A suggestion for what the user should do
  3. Your assessment of the likely root cause

user_template: |
  ## Failed Step

  Action: {action}
  Target: {target}
  Value: {value}
  Description: {description}

  ## Error Message

  {error}

  ## Task

  Diagnose this failure. What category is it? What should the user do?
