repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: git-cliff
        name: git-cliff changelog
        entry: bash -c 'uv run git-cliff -o CHANGELOG.md && git add CHANGELOG.md'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      # TODO: Enable after fixing type errors from models refactoring
