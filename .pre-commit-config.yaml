repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      # NOTE: git-cliff runs manually, not in pre-commit (can't include current commit message)
      # Run: uv run git-cliff -o CHANGELOG.md

      # TODO: Enable after fixing type errors from models refactoring
